worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include /etc/nginx/mime.types;

  # 1. Bloque HTTP Plano (Solo para Certbot y redirección segura)
  server {
    listen 8080;
    server_name smol-ivan.xyz www.smol-ivan.xyz;

    # Carpeta específica donde Certbot tirará el archivo de validación
    location /.well-known/acme-challenge/ {
      root /usr/share/nginx/html;
    }

    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Todo lo demás se va directo a HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # 2. Bloque HTTPS Seguro (Tu tráfico real)
  server {
    listen 8443 ssl; 
    server_name smol-ivan.xyz www.smol-ivan.xyz;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    ssl_certificate /etc/letsencrypt/live/smol-ivan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smol-ivan.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Hardening y optimización en HTTPS
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    error_page 404 /404.html;
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }

    location / {
      try_files $uri $uri/index.html =404;
    }
  }

  # 3. Uptime Kuma (kuma.smol-ivan.xyz)
  server {
    listen 8443 ssl;
    server_name kuma.smol-ivan.xyz;

    ssl_certificate /etc/letsencrypt/live/smol-ivan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smol-ivan.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker's internal DNS resolver. Re-resolves the container's IP on
    # every request instead of caching it once at nginx startup — this
    # avoids nginx getting stuck if Kuma restarts or starts after nginx.
    resolver 127.0.0.11 valid=10s;

    location / {
      set $kuma_upstream uptime-kuma:3001;
      proxy_pass http://$kuma_upstream;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade"; # Required: Kuma uses WebSockets
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 4. Umami (analytics.smol-ivan.xyz)
  server {
    listen 8443 ssl;
    server_name analytics.smol-ivan.xyz;

    ssl_certificate /etc/letsencrypt/live/smol-ivan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smol-ivan.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=10s;

    location / {
      set $umami_upstream umami:3000;
      proxy_pass http://$umami_upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
