networks:
    edge:
        name: edge
        external: true # Created once by the main docker-compose.yml, shared here

services:
    uptime-kuma:
        image: louislam/uptime-kuma:1
        restart: unless-stopped
        networks:
            - edge
        volumes:
            - kuma-data:/app/data
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 150M
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    umami-db:
        image: postgres:16-alpine
        restart: unless-stopped
        networks:
            - edge
        environment:
            POSTGRES_DB: umami
            POSTGRES_USER: umami
            POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
        volumes:
            - umami-db-data:/var/lib/postgresql/data
        # Not exposed to the host on purpose: only reachable from other
        # containers on the 'edge' network (i.e. the umami service).
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 200M
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
            interval: 10s
            timeout: 5s
            retries: 5
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    umami:
        image: ghcr.io/umami-software/umami:postgresql-latest
        restart: unless-stopped
        networks:
            - edge
        environment:
            DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
            APP_SECRET: ${UMAMI_APP_SECRET}
        depends_on:
            umami-db:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 200M
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    kuma-data:
    umami-db-data:
