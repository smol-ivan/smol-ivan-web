# Network can be attached as external by docker-compose.monitoring.yml
networks:
    edge:
        name: edge

services:
    smol-ivan-web:
        image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
        restart: unless-stopped
        networks:
            - edge
        ports:
            - "80:8080" # Listen to http and send it to nginx
            - "443:8443" # Listen to https and send it to nginx
        volumes:
            # Share certificate files
            - certbot-etc:/etc/letsencrypt:ro
            - acme-challenge:/usr/share/nginx/html/.well-known/acme-challenge

        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 256M

        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://127.0.0.1:8080/healthz",
                ]
            interval: 30s
            timeout: 10s
            retries: 3

    certbot:
        image: certbot/certbot
        restart: unless-stopped
        volumes:
            - certbot-etc:/etc/letsencrypt
            - certbot-var:/var/lib/letsencrypt
            - acme-challenge:/usr/share/nginx/html/.well-known/acme-challenge

        # Ask for certificate (first time)
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
    certbot-etc:
    certbot-var:
    acme-challenge:
