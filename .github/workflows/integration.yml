name: Integration

on:
    pull_request:
        branches:
            - main
        types: [opened, reopened, ready_for_review, synchronize]
    issue_comment:
        types: [created]

jobs:
    # Validaciones estaticas
    validate-astro:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - name: Code checkout
              uses: actions/checkout@v4

            - name: Node.js configuration
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Format validation (Prettier)
              run: npx prettier --check .

            - name: Check typos and astro code specifics
              run: npm run check

    validate-docker:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        needs: validate-astro

        steps:
            - name: Code checkout
              uses: actions/checkout@v4

            - name: Test docker image building
              run: |
                  docker build \
                    -t smol-ivan-web:test \
                    -f Dockerfile .

    pr_agent_job:
        if: |
            github.actor != 'dependabot[bot]' &&
            (github.event_name == 'pull_request' || startsWith(github.event.comment.body, '/'))
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
            contents: write
        steps:
            - name: PR Agent action step
              uses: the-pr-agent/pr-agent@main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  config.model: "gemini/gemini-3.1-flash-lite"
                  config.fallback_models: '["gemini/gemini-1.5-flash"]'
                  GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  github_action_config.auto_review: "true"
                  github_action_config.auto_describe: "true"
                  github_action_config.auto_improve: "true"
