name: Integration

on:
    pull_request:
        branches:
            - main
        types: [opened, reopened, ready_for_review, synchronize]

jobs:
    validate-astro:
        runs-on: ubuntu-latest
        steps:
            - name: Code checkout
              uses: actions/checkout@v4

            - name: Node.js configuration
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Format validation (Prettier)
              run: npx prettier --check .

            - name: Check typos and astro code specifics
              run: npm run check

    validate-docker:
        runs-on: ubuntu-latest
        needs: validate-astro
        steps:
            - name: Code checkout
              uses: actions/checkout@v4

            - name: Test docker image building
              run: |
                  docker build \
                    -t smol-ivan-web:test \
                    -f Dockerfile .

    pr_agent_job:
        needs: validate-docker
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
            contents: write
        steps:
            - name: PR Agent action step
              uses: the-pr-agent/pr-agent@main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  OPENAI_KEY: ${{ secrets.GEMINI_API_KEY }}
                  CONFIG.MODEL: "gemini/gemini-2.5-flash"
                  github_action_config.auto_review: "true"
                  github_action_config.auto_describe: "true"
                  github_action_config.auto_improve: "true"
